<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Ropa - Inventario (Node.js)</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" style="padding: 10px 20px; background-color: #ffffff; border-bottom: 2px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between;">
        <div class="logo-container" style="display: flex; align-items: center; gap: 12px;">
            <!-- Contenedor circular que recorta automáticamente el espacio blanco de los lados -->
            <div style="width: 55px; height: 55px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background-color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.15);">
                <img src="/img/pimpollito.jpg" alt="Pimpollitos Kids" style="width: 100%; height: 100%; object-fit: cover; object-position: center;">
            </div>
            <span style="font-weight: bold; font-size: 1.3rem; color: #333;">Pimpollitos Kids</span>
        </div>
        <ul class="nav-links" style="display: flex; gap: 15px; list-style: none; margin: 0; padding: 0;">
            <li><a href="/" style="text-decoration: none; font-weight: 600; color: #333;">Inventario</a></li>
            <li><a href="/ventas" style="text-decoration: none; font-weight: 600; color: #333;">Punto de Venta (POS)</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="card">
            <h2>Gestión de Inventario y Precios</h2>
            <form id="form-producto" onsubmit="guardarProducto(event)">
                <input type="hidden" id="prod-id">
                <div class="form-grid">
                    <!-- El código se genera automáticamente en el servidor si se omite -->
                    <input type="text" id="prod-nombre" placeholder="Nombre de la prenda" required>
                    
                    <!-- Desplegable dinámico de Categoría -->
                    <select id="prod-categoria" required>
                        <option value="">Cargando categorías...</option>
                    </select>

                    <!-- Desplegable dinámico de Talla -->
                    <select id="prod-talla" required>
                        <option value="">Cargando tallas...</option>
                    </select>

                    <!-- Desplegable dinámico de Color -->
                    <select id="prod-color" required>
                        <option value="">Cargando colores...</option>
                    </select>

                    <input type="number" step="0.01" id="prod-compra" placeholder="Precio Compra (\$)" required>
                    <input type="number" step="0.01" id="prod-venta" placeholder="Precio Venta (\$)" required>
                    <input type="number" id="prod-stock" placeholder="Stock Inicial" required>
                </div>
                <div class="btn-group">
                    <button type="submit" id="btn-guardar" class="btn btn-primary">Agregar Producto</button>
                    <button type="button" onclick="limpiarFormulario()" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h3>Catálogo de Productos</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Talla</th>
                        <th>Color</th>
                        <th>P. Compra</th>
                        <th>P. Venta</th>
                        <th>Ganancia Unit.</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-inventario"></tbody>
            </table>
        </div>
    </main>

    <script>
        let modoEdicion = false;

        // Cargar opciones desplegables desde el endpoint /api/metadata
        async function cargarListasDesplegables() {
            try {
                const res = await fetch('/api/metadata');
                const data = await res.json();

                // Llenar Categorías
                const selectCat = document.getElementById('prod-categoria');
                selectCat.innerHTML = '<option value="">Seleccione Categoría</option>';
                data.categorias.forEach(cat => {
                    selectCat.innerHTML += `<option value="${cat}">${cat}</option>`;
                });

                // Llenar Tallas
                const selectTalla = document.getElementById('prod-talla');
                selectTalla.innerHTML = '<option value="">Seleccione Talla</option>';
                data.tallas.forEach(talla => {
                    selectTalla.innerHTML += `<option value="${talla}">${talla}</option>`;
                });

                // Llenar Colores
                const selectColor = document.getElementById('prod-color');
                selectColor.innerHTML = '<option value="">Seleccione Color</option>';
                data.colores.forEach(color => {
                    selectColor.innerHTML += `<option value="${color}">${color}</option>`;
                });
            } catch (error) {
                console.error("Error al cargar metadatos:", error);
            }
        }

        async function cargarTabla() {
            const res = await fetch('/api/productos');
            const productos = await res.json();
            const tbody = document.getElementById('tabla-inventario');
            tbody.innerHTML = '';

            productos.forEach(p => {
                // Definir estilo y etiqueta si el stock es bajo (<= 2 unidades)
                const estiloStock = p.stock_bajo 
                    ? 'color: #dc3545; font-weight: bold; background-color: #f8d7da; padding: 4px 8px; border-radius: 4px;' 
                    : '';
                
                const textoStock = p.stock_bajo 
                    ? `${p.stock} ⚠️ (Bajo)` 
                    : p.stock;

                tbody.innerHTML += `
                    <tr>
                        <td><b>${p.codigo}</b></td>
                        <td>${p.nombre}</td>
                        <td><span class="badge">${p.categoria || '-'}</span></td>
                        <td>${p.talla || '-'}</td>
                        <td>${p.color || '-'}</td>
                        <td>$${p.precio_compra.toFixed(2)}</td>
                        <td>$${p.precio_venta.toFixed(2)}</td>
                        <td class="text-success">$${p.ganancia_unitaria.toFixed(2)}</td>
                        <td><span style="${estiloStock}">${textoStock}</span></td>
                        <td>
                            <button class="btn btn-sm btn-edit" onclick="prepararEdicion('${p.id}', '${p.codigo}', '${p.nombre}', '${p.categoria}', '${p.talla || ''}', '${p.color || ''}', ${p.precio_compra}, ${p.precio_venta}, ${p.stock})">Editar</button>
                            <button class="btn btn-sm btn-delete" onclick="eliminarProducto('${p.id}')">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function guardarProducto(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const body = {
                nombre: document.getElementById('prod-nombre').value,
                categoria: document.getElementById('prod-categoria').value,
                talla: document.getElementById('prod-talla').value,
                color: document.getElementById('prod-color').value,
                precio_compra: document.getElementById('prod-compra').value,
                precio_venta: document.getElementById('prod-venta').value,
                stock: document.getElementById('prod-stock').value
            };

            const url = modoEdicion ? `/api/productos/${id}` : '/api/productos';
            const metodo = modoEdicion ? 'PUT' : 'POST';

            await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            limpiarFormulario();
            cargarTabla();
        }

        function prepararEdicion(id, codigo, nombre, categoria, talla, color, compra, venta, stock) {
            modoEdicion = true;
            document.getElementById('prod-id').value = id;
            document.getElementById('prod-nombre').value = nombre;
            document.getElementById('prod-categoria').value = categoria;
            document.getElementById('prod-talla').value = talla;
            document.getElementById('prod-color').value = color;
            document.getElementById('prod-compra').value = compra;
            document.getElementById('prod-venta').value = venta;
            document.getElementById('prod-stock').value = stock;
            document.getElementById('btn-guardar').innerText = "Actualizar Producto";
        }

        async function eliminarProducto(id) {
            if (confirm("¿Seguro que deseas eliminar este producto?")) {
                await fetch(`/api/productos/${id}`, { method: 'DELETE' });
                cargarTabla();
            }
        }

        function limpiarFormulario() {
            modoEdicion = false;
            document.getElementById('form-producto').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('btn-guardar').innerText = "Agregar Producto";
        }

        // Inicializar la vista
        cargarListasDesplegables();
        cargarTabla();
    </script>
</body>
</html>
