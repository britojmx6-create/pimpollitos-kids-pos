<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Ropa - Inventario (Node.js)</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" style="padding: 10px 20px; background-color: #ffffff; border-bottom: 2px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
        <div class="logo-container" style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 55px; height: 55px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background-color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.15);">
                <img src="/img/pimpollito.jpg" alt="Pimpollitos Kids" style="width: 100%; height: 100%; object-fit: cover; object-position: center;">
            </div>
            <span style="font-weight: bold; font-size: 1.3rem; color: #333;">Pimpollitos Kids</span>
        </div>
        <ul class="nav-links" style="display: flex; gap: 15px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap;">
            <li><a href="/" style="text-decoration: none; font-weight: 600; color: #e91e63;">Inventario</a></li>
            <li><a href="/ventas" style="text-decoration: none; font-weight: 600; color: #333;">Punto de Venta (POS)</a></li>
            <li><a href="/fiados" style="text-decoration: none; font-weight: 600; color: #333;">Fiados</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="card">
            <h2>Gestión de Inventario y Precios</h2>
            <form id="form-producto" onsubmit="guardarProducto(event)">
                <input type="hidden" id="prod-id">
                <div class="form-grid">
                    <input type="text" id="prod-nombre" placeholder="Nombre de la prenda" required>
                    
                    <select id="prod-categoria" required>
                        <option value="">Cargando categorías...</option>
                    </select>

                    <select id="prod-talla" required>
                        <option value="">Cargando tallas...</option>
                    </select>

                    <select id="prod-color" required>
                        <option value="">Cargando colores...</option>
                    </select>

                    <input type="number" step="0.01" id="prod-compra" placeholder="Precio Compra ($)" required>
                    <input type="number" step="0.01" id="prod-venta" placeholder="Precio Venta ($)" required>
                    <input type="number" id="prod-stock" placeholder="Stock Inicial" required>
                    
                    <!-- Opciones de Imagen: Seleccionar archivo o Tomar foto -->
                    <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px;">
                        <label style="font-size: 0.85rem; font-weight: 600; color: #555;">Fotografía de la prenda:</label>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                            
                            <!-- Opción 1: Seleccionar archivo existente -->
                            <label class="btn btn-secondary" style="cursor: pointer; font-size: 0.85rem; padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; margin: 0;">
                                📁 Seleccionar Archivo
                                <input type="file" id="prod-imagen-file" accept="image/*" onchange="manejarSeleccionImagen(event)" style="display: none;">
                            </label>
                            
                            <!-- Opción 2: Tomar foto directa con la cámara -->
                            <label class="btn btn-primary" style="cursor: pointer; font-size: 0.85rem; padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; margin: 0;">
                                📸 Tomar Foto
                                <input type="file" id="prod-imagen-camara" accept="image/*" capture="environment" onchange="manejarSeleccionImagen(event)" style="display: none;">
                            </label>

                            <!-- Vista previa de la imagen -->
                            <img id="preview-img" src="" alt="Vista previa" style="width: 55px; height: 55px; object-fit: cover; border-radius: 8px; display: none; border: 2px solid #e2e8f0;">
                        </div>
                        
                        <input type="hidden" id="prod-imagen-nombre">
                        <input type="hidden" id="prod-imagen-base64">
                    </div>
                </div>
                <div class="btn-group">
                    <button type="submit" id="btn-guardar" class="btn btn-primary">Agregar Producto</button>
                    <button type="button" onclick="limpiarFormulario()" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h3>Catálogo de Productos</h3>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Talla</th>
                            <th>Color</th>
                            <th>P. Compra</th>
                            <th>P. Venta</th>
                            <th>Ganancia Unit.</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-inventario"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let modoEdicion = false;

        async function cargarListasDesplegables() {
            try {
                const res = await fetch('/api/metadata');
                const data = await res.json();

                const selectCat = document.getElementById('prod-categoria');
                selectCat.innerHTML = '<option value="">Seleccione Categoría</option>';
                (data.categorias || []).forEach(cat => {
                    selectCat.innerHTML += `<option value="${cat}">${cat}</option>`;
                });

                const selectTalla = document.getElementById('prod-talla');
                selectTalla.innerHTML = '<option value="">Seleccione Talla</option>';
                (data.tallas || []).forEach(talla => {
                    selectTalla.innerHTML += `<option value="${talla}">${talla}</option>`;
                });

                const selectColor = document.getElementById('prod-color');
                selectColor.innerHTML = '<option value="">Seleccione Color</option>';
                (data.colores || []).forEach(color => {
                    selectColor.innerHTML += `<option value="${color}">${color}</option>`;
                });
            } catch (error) {
                console.error("Error al cargar metadatos:", error);
            }
        }

        async function cargarTabla() {
            try {
                const res = await fetch('/api/productos');
                const productos = await res.json();
                const tbody = document.getElementById('tabla-inventario');
                tbody.innerHTML = '';

                if (productos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: #888; padding: 20px;">No hay productos registrados</td></tr>`;
                    return;
                }

                productos.forEach(p => {
                    const estiloStock = p.stock_bajo 
                        ? 'color: #dc3545; font-weight: bold; background-color: #f8d7da; padding: 4px 8px; border-radius: 4px;' 
                        : '';
                    
                    const textoStock = p.stock_bajo 
                        ? `${p.stock} ⚠️ (Bajo)` 
                        : p.stock;

                    tbody.innerHTML += `
                        <tr>
                            <td><b>${p.codigo}</b></td>
                            <td>${p.nombre}</td>
                            <td><span class="badge">${p.categoria || '-'}</span></td>
                            <td>${p.talla || '-'}</td>
                            <td>${p.color || '-'}</td>
                            <td>$${p.precio_compra.toFixed(2)}</td>
                            <td>$${p.precio_venta.toFixed(2)}</td>
                            <td class="text-success">$${p.ganancia_unitaria.toFixed(2)}</td>
                            <td><span style="${estiloStock}">${textoStock}</span></td>
                            <td>
                                <div class="btn-action-group">
                                    <button class="btn-icon edit" title="Editar" onclick="prepararEdicion('${p.id}', '${p.codigo}', '${p.nombre}', '${p.categoria}', '${p.talla || ''}', '${p.color || ''}', ${p.precio_compra}, ${p.precio_venta}, ${p.stock}, '${p.imagen || ''}')">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                    </button>
                                    <button class="btn-icon delete" title="Eliminar" onclick="eliminarProducto('${p.id}')">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar la tabla:", error);
            }
        }

        function manejarSeleccionImagen(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('prod-imagen-nombre').value = file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('prod-imagen-base64').value = e.target.result;
                const preview = document.getElementById('preview-img');
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        async function guardarProducto(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const body = {
                nombre: document.getElementById('prod-nombre').value,
                categoria: document.getElementById('prod-categoria').value,
                talla: document.getElementById('prod-talla').value,
                color: document.getElementById('prod-color').value,
                precio_compra: document.getElementById('prod-compra').value,
                precio_venta: document.getElementById('prod-venta').value,
                stock: document.getElementById('prod-stock').value,
                imagen_nombre: document.getElementById('prod-imagen-nombre').value,
                imagen_base64: document.getElementById('prod-imagen-base64').value
            };

            const url = modoEdicion ? `/api/productos/${id}` : '/api/productos';
            const metodo = modoEdicion ? 'PUT' : 'POST';

            await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            limpiarFormulario();
            cargarTabla();
        }

        function prepararEdicion(id, codigo, nombre, categoria, talla, color, compra, venta, stock, imagen) {
            modoEdicion = true;
            document.getElementById('prod-id').value = id;
            document.getElementById('prod-nombre').value = nombre;
            document.getElementById('prod-categoria').value = categoria;
            document.getElementById('prod-talla').value = talla;
            document.getElementById('prod-color').value = color;
            document.getElementById('prod-compra').value = compra;
            document.getElementById('prod-venta').value = venta;
            document.getElementById('prod-stock').value = stock;
            document.getElementById('prod-imagen-nombre').value = imagen || '';
            document.getElementById('prod-imagen-base64').value = '';
            document.getElementById('prod-imagen-file').value = '';
            document.getElementById('prod-imagen-camara').value = '';
            
            const preview = document.getElementById('preview-img');
            if (imagen) {
                preview.src = `/img/productos/${imagen}`;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
            document.getElementById('btn-guardar').innerText = "Actualizar Producto";
        }

        async function eliminarProducto(id) {
            if (confirm("¿Seguro que deseas eliminar este producto?")) {
                await fetch(`/api/productos/${id}`, { method: 'DELETE' });
                cargarTabla();
            }
        }

        function limpiarFormulario() {
            modoEdicion = false;
            document.getElementById('form-producto').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('prod-imagen-nombre').value = '';
            document.getElementById('prod-imagen-base64').value = '';
            document.getElementById('preview-img').style.display = 'none';
            document.getElementById('btn-guardar').innerText = "Agregar Producto";
        }

        cargarListasDesplegables();
        cargarTabla();
    </script>
</body>
</html>
